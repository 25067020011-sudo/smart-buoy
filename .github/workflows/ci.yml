name: CI & Code Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-dashboard-and-tools:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f dashboard/requirements.txt ]; then pip install -r dashboard/requirements.txt; fi

    - name: Lint Python code
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 dashboard/ tools/ analysis/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 dashboard/ tools/ analysis/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Verify simulator script
      run: |
        python tools/simulate_telemetry.py --dry-run --count 2

    - name: Verify DQA analysis script
      run: |
        python analysis/dqa_assessment.py
